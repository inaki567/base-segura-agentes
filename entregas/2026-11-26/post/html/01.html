<html><head><meta charset="utf-8"><link href="file:///tmp/bs/fonts/fonts.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;font-family:Manrope;position:relative;overflow:hidden}
.dark{background:#0D1117;color:#fff} .white{background:#fff;color:#0D1117}
.blue{background:#1FA9E8;color:#0D1117} .orange{background:#F2A33A;color:#0D1117}
.pad{position:absolute;inset:0;padding:96px 88px}
.top{display:flex;justify-content:space-between;font-family:Outfit;font-weight:800;letter-spacing:3px;font-size:28px}
.count{font-family:Outfit;font-weight:700;font-size:28px;color:#8b949e;letter-spacing:1px}
.white .count{color:#6b7280}
h1{font-family:Outfit;font-weight:900;line-height:.92;letter-spacing:-3px;text-transform:uppercase}
.b{color:#1FA9E8} .o{color:#F2A33A} .w{color:#fff}
.pill{display:inline-block;background:#0D1117;color:#fff;font-family:Outfit;font-weight:800;font-size:32px;letter-spacing:1.5px;padding:18px 30px;border-radius:40px}
.quote{border-left:8px solid #F2A33A;padding-left:30px;font-size:34px;line-height:1.35;color:#9aa4ae}
.white .quote{color:#4b5563}
.quote strong{color:#fff} .white .quote strong{color:#0D1117}
.foot{position:absolute;left:88px;right:88px;bottom:88px;display:flex;justify-content:space-between;align-items:center;font-family:Outfit;font-weight:800;font-size:28px}
.dash{display:flex;gap:10px} .dash i{width:34px;height:7px;border-radius:4px;background:#d9dde2} .dash i.on{background:#1FA9E8}
.box{background:#0D1117;color:#fff;border-radius:30px;padding:34px 36px;display:flex;justify-content:space-between;align-items:center}
.box small{display:block;font-family:Outfit;font-weight:800;letter-spacing:3px;font-size:22px;color:#9aa4ae;margin-bottom:6px}
.box b{font-family:Outfit;font-weight:800;font-size:32px}
.item{display:flex;gap:30px;align-items:flex-start;margin-bottom:38px}
.num{font-family:Outfit;font-weight:900;font-size:76px;line-height:.9;color:#1FA9E8;min-width:110px}
.item h3{font-family:Outfit;font-weight:800;font-size:46px;line-height:1.05}
.item p{font-size:30px;line-height:1.35;color:#4b5563;margin-top:8px}
.dark .item p{color:#9aa4ae}
.chk{width:62px;height:62px;border-radius:16px;flex:none;display:flex;align-items:center;justify-content:center}
</style></head>
