<!-- Vista previa del carrusel: muestra 01.png..04.png en una fila. -->
<html><body style="margin:0;background:#ebebeb;width:1540px;height:980px;display:flex;align-items:center;justify-content:center;gap:20px">
<script>for(let i=1;i<=4;i++){const im=new Image();im.src=String(i).padStart(2,'0')+'.png';im.width=360;im.height=450;im.onerror=()=>im.remove();document.body.appendChild(im)}</script>
</body></html>
