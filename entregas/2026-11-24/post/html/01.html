<html><head><meta charset="utf-8"><link href="file:///tmp/bs/fonts/fonts.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet"><style>






*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;font-family:Manrope;position:relative;overflow:hidden}
.dark{background:#0D1117;color:#fff} .white{background:#fff;color:#0D1117}

.box b{font-family:Outfit;font-weight:800;font-size:32px}
.item{display:flex;gap:30px;align-items:flex-start;margin-bottom:38px}
.num{font-family:Outfit;font-weight:900;font-size:76px;line-height:.9;color:#1FA9E8;min-width:110px}
.item h3{font-family:Outfit;font-weight:800;font-size:46px;line-height:1.05}
.item p{font-size:30px;line-height:1.35;color:#4b5563;margin-top:8px}
.dark .item p{color:#9aa4ae}
.chk{width:62px;height:62px;border-radius:16px;flex:none;display:flex;align-items:center;justify-content:center}
